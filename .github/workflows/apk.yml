# Builds FreeMyTV.apk (this fork's own build, with the wallpaper) and keeps it as a download on the run's page.
# Start it by hand (Actions > APK > Run workflow) or push to main.
name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Settings (Ivry-sur-Seine, French, dark)
        run: |
          cat > config.properties <<'CONF'
          tmdb_region=FR
          latitude=48.8139
          longitude=2.3847
          city=Ivry-sur-Seine
          language=fr
          currency=EUR
          temperature=C
          clock_format=24
          theme=dark
          CONF
          sed -i 's/^ *//' config.properties
      # With the KEYSTORE_B64 and KEYSTORE_PASS secrets every build is signed with the same key, so a new APK installs
      # over the previous one; without them each build gets a throwaway key and the old app must be uninstalled first.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FREEMYTV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "FREEMYTV_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          fi
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk
